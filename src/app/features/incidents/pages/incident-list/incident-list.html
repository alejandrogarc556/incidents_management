<h1>Incident Dashboard</h1>

@if (selectedIncidentId !== null) {

<div class="selected-banner">

    Selected Incident:
    #{{ selectedIncidentId }}

</div>

}

@if (incidents.length > 0) {

<div class="incident-grid">

    @for (
    incident of incidents;
    track incident.id
    ) {

    <app-incident-card [incident]="incident" (selected)="onIncidentSelected($event)"
        (removed)="onIncidentRemoved($event)">

    </app-incident-card>

    }

</div>

} @else {

<div class="empty-state">

    No incidents available.

</div>

}
