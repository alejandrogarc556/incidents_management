<section class="dashboard">
    <h1>API Dashboard</h1>

    <div class="actions">
        <button type="button" (click)="createDemo()">POST</button>

        <button type="button" (click)="updateDemo()">PUT</button>

        <button type="button" (click)="deleteDemo()">DELETE</button>
    </div>

    @if (loading()) {
    <div class="loading">Loading incidents...</div>
    }

    @if (error()) {
    <div class="error">
        {{ error() }}
    </div>
    }

    @if (success()) {
    <div class="success">
        {{ success() }}
    </div>
    }

    @if (!loading() && !error()) {
    <div class="dashboard-cards">
        @for (incident of incidents(); track incident.id) {
        <div class="dashboard-card">
            <h3>
                {{ incident.title }}
            </h3>
            <p>
                {{ incident.body }}
            </p>
        </div>
        }
    </div>
    }
</section>
